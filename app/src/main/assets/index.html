<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>קודש הקודשים</title>
<style>
:root{
  --gold:#d4af6a;
  --gold-bright:#f4d98e;
  --bg1:#05070d;
  --bg2:#0d1420;
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg1);font-family:'Segoe UI',sans-serif;}
#stars{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg1) 80%);z-index:0;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0.5;}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#eee;}

#status{
  position:absolute;top:6%;left:50%;transform:translateX(-50%);
  font-size:14px;color:var(--gold);opacity:0.8;text-align:center;
  letter-spacing:1px;
}

#distance{
  position:absolute;bottom:8%;left:50%;transform:translateX(-50%);
  text-align:center;
}
#distance .km{font-size:28px;font-weight:600;color:var(--gold-bright);}
#distance .label{font-size:12px;color:#999;margin-top:2px;}

/* ---------- FLAT MODE (compass disk) ---------- */
#flatCompass{
  width:78vw;max-width:340px;aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.08),transparent 60%),var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(14px);
  box-shadow:0 0 60px rgba(212,175,106,0.08), inset 0 0 40px rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;position:relative;
  transition:opacity .4s ease, transform .4s ease;
}
#flatCompass .ring{
  position:absolute;inset:6%;border-radius:50%;
  border:1px solid rgba(212,175,106,0.25);
}
#flatDial{
  width:88%;height:88%;border-radius:50%;position:relative;
  transition:transform .15s ease-out;
}
#flatArrow{
  position:absolute;top:4%;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;
  border-bottom:26px solid var(--gold-bright);
  filter:drop-shadow(0 0 8px rgba(244,217,142,0.7));
}
#flatDial::after{
  content:"בית המקדש";position:absolute;top:16%;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--gold);white-space:nowrap;letter-spacing:1px;
}
#flatCenter{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;border-radius:50%;background:var(--gold-bright);
  box-shadow:0 0 20px rgba(244,217,142,0.8);
}

/* ---------- UPRIGHT MODE (AR 3D tilted dish) ---------- */
#uprightView{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s ease;
  perspective:900px;
}
#arStage{
  width:64vw;max-width:280px;aspect-ratio:1/1;position:relative;
  transform-style:preserve-3d;
  transform:rotateX(48deg);
}
#arGlass{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.1),transparent 60%),var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);
  box-shadow:0 0 80px rgba(212,175,106,0.12), inset 0 0 50px rgba(0,0,0,0.5);
  transform:translateZ(0px);
}
#arRing1{
  position:absolute;inset:8%;border-radius:50%;
  border:1px solid rgba(212,175,106,0.3);
  transform:translateZ(10px);
}
#arRing2{
  position:absolute;inset:20%;border-radius:50%;
  border:1px solid rgba(212,175,106,0.5);
  background:radial-gradient(circle,rgba(212,175,106,0.06),transparent 70%);
  transform:translateZ(20px);
}
#arWall{
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0.55) 100%);
  transform:translateZ(-6px);
  box-shadow:0 30px 40px -10px rgba(0,0,0,0.6);
}
#arArrow{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:translateZ(34px);
  transition:transform .15s ease-out;
}
#arArrowInner{
  width:38%;height:38%;
  transform:rotateX(-48deg);
}
#arArrowInner svg{width:100%;height:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,0.5)) drop-shadow(0 0 14px rgba(244,217,142,0.6));}

#directionHint{
  position:absolute;top:13%;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  font-size:22px;font-weight:700;color:var(--gold-bright);
  letter-spacing:0.5px;transition:color .3s ease;
}
#hintArrow{font-size:26px;line-height:1;transition:transform .2s ease;}
#foundBadge{
  position:absolute;top:12%;left:50%;transform:translateX(-50%) scale(0.7);
  font-size:22px;font-weight:800;color:#5adc8c;white-space:nowrap;
  opacity:0;transition:opacity .2s ease, transform .2s ease;
  text-shadow:0 0 30px rgba(90,220,140,1);
  z-index:5;
}
.on-target #directionHint{opacity:0;}
.on-target #foundBadge{opacity:1;transform:translateX(-50%) scale(1);}

#flashOverlay{
  position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(90,220,140,0.35),transparent 65%);
  transition:opacity .3s ease;
}
.on-target #flashOverlay{opacity:1;animation:flashPulse 1s infinite;}
@keyframes flashPulse{
  0%{opacity:0.5;} 50%{opacity:1;} 100%{opacity:0.5;}
}

#invertBtn{
  position:absolute;bottom:3%;left:50%;transform:translateX(-50%);
  background:var(--glass);border:1px solid var(--glass-border);color:#999;
  font-size:11px;padding:6px 14px;border-radius:20px;
  backdrop-filter:blur(8px);z-index:5;
}
#invertBtn.active{color:var(--gold-bright);border-color:var(--gold);}

.on-target #flatCompass{
  animation:pulseGreenBg 1s infinite;
}
.on-target #arStage #arGlass{
  animation:pulseGreenBg 1s infinite;
}
@keyframes pulseGreenBg{
  0%{box-shadow:0 0 40px rgba(80,220,140,0.5), inset 0 0 60px rgba(80,220,140,0.15);}
  50%{box-shadow:0 0 90px rgba(80,220,140,0.9), inset 0 0 90px rgba(80,220,140,0.3);}
  100%{box-shadow:0 0 40px rgba(80,220,140,0.5), inset 0 0 60px rgba(80,220,140,0.15);}
}
.on-target #flatCenter{
  background:#5adc8c !important;
  box-shadow:0 0 30px rgba(90,220,140,1) !important;
}
.on-target #arArrowInner svg,.on-target #flatArrow{
  filter:drop-shadow(0 0 20px rgba(90,220,140,1)) !important;
}
.on-target #flatArrow{
  border-bottom-color:#5adc8c !important;
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <div id="status">מאתר מיקום...</div>
  <div id="directionHint"><span id="hintArrow"></span><span id="hintDeg"></span></div>
  <div id="foundBadge">✓ זהו הכיוון!</div>
  <button id="invertBtn" onclick="toggleInvert()">↔ היפוך כיוון</button>
  <div id="flashOverlay"></div>

  <div id="flatCompass">
    <div class="ring"></div>
    <div id="flatArrow"></div>
    <div id="flatDial">
      <div id="flatCenter"></div>
    </div>
  </div>

  <div id="uprightView">
    <div id="arStage">
      <div id="arWall"></div>
      <div id="arGlass"></div>
      <div id="arRing1"></div>
      <div id="arRing2"></div>
      <div id="arArrow">
        <div id="arArrowInner">
          <svg viewBox="0 0 100 100">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f4d98e"/>
                <stop offset="100%" stop-color="#b4863f"/>
              </linearGradient>
            </defs>
            <polygon points="50,8 72,60 50,46 28,60" fill="url(#g1)"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div id="distance">
    <div class="km" id="distKm">--</div>
    <div class="label">מרחק לקודש הקודשים</div>
  </div>
</div>

<script src="compass.js"></script>
</body>
</html>
